<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Exploration - Dominic Eriksson</title>

  <!-- Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+BxDMD7fRQxqxRa6vOBm6PqlKFSxZi58+lG7jIlu0=" crossorigin="" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fdfdfd;
      color: #1c1c1e;
      margin: 0;
      padding: 0 24px;
      line-height: 1.6;
      max-width: 960px;
      margin: auto;
    }

    header {
      background: linear-gradient(to bottom, rgba(28,28,30,0.85), rgba(28,28,30,0.5)), url('Images/ocean-1845110.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 60px 20px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: auto;
    }

    nav {
      margin: 16px 0;
      font-size: 0.9rem;
      color: #0071e3;
    }

    nav a {
      text-decoration: none;
      color: #0071e3;
    }

    section {
      margin: 64px 0;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      color: #0071e3;
      border-bottom: 2px solid #0071e3;
      padding-bottom: 6px;
    }

    #map {
      height: 600px;
      width: 100%;
      border: 2px solid #ccc;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Data Exploration</h1>
    <p>Interactive map visualizing selected marine data and model outputs.</p>
  </header>

  <nav aria-label="breadcrumb">
    <a href="index_v4.html">Home</a> &gt; <a href="Research.html">Research</a> &gt; Data Exploration
  </nav>

  <section>
    <h2>Interactive Map</h2>
    <div id="map"></div>
  </section>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-CVj2P5Jv94Vd5VUEOH5NwnXqJ+gkTQvI5gsGNs5y0ik=" crossorigin=""></script>

  <script>
    // Initialize the map
    var map = L.map('map').setView([0, 0], 2);

    // Add tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Example markers - you can replace with dynamic data
    const markers = [
      { lat: 51.505, lon: -0.09, label: 'London' },
      { lat: -33.865, lon: 151.209, label: 'Sydney' },
      { lat: 35.6895, lon: 139.6917, label: 'Tokyo' }
    ];

    markers.forEach(point => {
      L.marker([point.lat, point.lon])
        .addTo(map)
        .bindPopup(point.label);
    });
  </script>
</body>
</html>
